org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:HeapBaseMinAddress=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=4
org.gradle.vfs.watch=false
android.useAndroidX=true

# Pub cache on another drive (e.g. D:\) + project on C:\ breaks Kotlin incremental
# (different file roots → daemon/cache errors). Disable incremental for stable Android builds.
kotlin.incremental=false
kotlin.incremental.android=false