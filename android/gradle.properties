org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
android.useAndroidX=true

# Pub cache on another drive (e.g. D:\) + project on C:\ breaks Kotlin incremental
# (different file roots → daemon/cache errors). Disable incremental for stable Android builds.
kotlin.incremental=false
kotlin.incremental.android=false